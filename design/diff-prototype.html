<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <title>Prototip razlika</title>
    <link rel="icon" href="/icon.svg" />
    <!--
      The diff view with two boxes to feed it, for finding out what it gets wrong
      and what it lacks. Not part of the app: served by scripts/serve.mjs at
      /diff-prototype, and its script is built into dist-browser/ only.

      The view's own look comes from the app's stylesheet, so what is seen here
      is what the app draws. Only this page's scaffolding is styled below.
    -->
    <link rel="stylesheet" href="/interface.css" />
    <style>
      body {
        flex-direction: column;
        gap: 0.6rem;
        box-sizing: border-box;
        padding: 0.8rem 1.2rem;
        background: var(--page);
        color: var(--ink);
      }

      .prototype-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
      }

      .prototype-controls button {
        padding: 0.25rem 0.7rem;
      }

      .prototype-controls label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      /* The footer of a real dialog, so that its buttons are those of one. The rest of
         a dialog's panel has no business on this page. */
      .prototype-panel {
        flex: none;
        width: 100%;
        padding: 0;
        border: 0;
        box-shadow: none;
        overflow: visible;
      }

      .prototype-panel footer {
        margin-top: 0;
        padding: 0.4rem 0 0;
        border-top: 0;
      }

      .prototype-boxes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.8rem;
      }

      .prototype-boxes label {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-weight: 600;
      }

      .prototype-boxes textarea {
        box-sizing: border-box;
        width: 100%;
        height: 16vh;
        padding: 0.5rem 0.7rem;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--page);
        color: var(--ink);
        font-family: var(--writing-font);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.4;
      }

      #view {
        flex: 1;
        min-height: 12rem;
        display: flex;
      }

      /* Clear of the stepper, which sits at the end of the last of these lines. */
      #view .review-note-aside {
        padding-right: 19rem;
      }

      /*
        Ways of saying "this answers a click" under the pointer, to choose from. The
        app's own is the outline; the others take its place here only. Light mode only.
      */
      #view:not([data-hover='outline']) .review-text :is(.diff-change, .diff-change-carried, .diff-tidied-letter):hover {
        outline: none;
      }

      /* 1. The fills lighter, and a yellow marker behind what has no fill. */
      #view[data-hover='lighter'] :is(.diff-change, .diff-change-carried):hover :is(.diff-new, .diff-gone) {
        filter: brightness(1.45) saturate(1.15);
      }

      #view[data-hover='lighter'] :is(.diff-change, .diff-change-carried):hover .diff-resolved,
      #view[data-hover='lighter'] .diff-tidied-letter:hover {
        background: hsl(52 100% 76%);
        box-shadow: 0 0 0 2px hsl(52 100% 76%);
      }

      /* 2. The fills darker and stronger, and a pale band of its own green behind what has none. */
      #view[data-hover='darker'] :is(.diff-change, .diff-change-carried):hover :is(.diff-new, .diff-gone) {
        filter: brightness(0.62) saturate(1.4);
      }

      #view[data-hover='darker'] :is(.diff-change, .diff-change-carried):hover .diff-resolved {
        background: hsl(142 55% 84%);
        box-shadow: 0 0 0 2px hsl(142 55% 84%);
      }

      #view[data-hover='darker'] .diff-tidied-letter:hover {
        background: hsl(4 85% 87%);
        box-shadow: 0 0 0 2px hsl(4 85% 87%);
      }

      /*
        4. As the buttons answer: the wash they darken with, over whatever is there. Over
        a fill as an inset shadow, since the struck line through red is a background and
        a background laid over it would hide it. Pressed drops a pixel, as a button does.
      */
      #view:is([data-hover='buttons'], [data-hover='underline']) :is(.diff-change, .diff-change-carried):hover :is(.diff-new, .diff-gone) {
        box-shadow: inset 0 0 0 100vmax var(--wash-firm);
      }

      /* With no fill, a darker ground, on a target wider than the words: grown into the
         space around them, and taken back by a margin, so that no line moves. Letters
         grow less, so that two of them one letter apart, as in šiša, do not meet. */
      #view:is([data-hover='buttons'], [data-hover='underline']) :is(.diff-change, .diff-change-carried):has(.diff-resolved) {
        padding: 0.18em 0.25em;
        margin: 0 -0.25em;
        border-radius: 3px;
        box-decoration-break: clone;
      }

      #view:is([data-hover='buttons'], [data-hover='underline']) .diff-tidied-letter {
        padding: 0.18em 0.1em;
        margin: 0 -0.1em;
        border-radius: 2px;
      }

      #view:is([data-hover='buttons'], [data-hover='underline']) :is(.diff-change, .diff-change-carried):has(.diff-resolved):hover,
      #view:is([data-hover='buttons'], [data-hover='underline']) .diff-tidied-letter:hover {
        background: var(--wash-firm);
      }

      #view:is([data-hover='buttons'], [data-hover='underline']) :is(.diff-change, .diff-change-carried, .diff-tidied-letter):active {
        position: relative;
        top: 1px;
      }

      /*
        5. As 4, and under the change pointed at, the current change's own dashed line in
        grey: the same mark, quieter, so that it says "this one" without outranking the
        current one, which has it in ink. Not on the current change, which has it already.
      */
      #view[data-hover='underline'] :is(.diff-change, .diff-change-carried):hover:not(.diff-current) {
        --marks-reach: 0.05em;
        padding-bottom: calc(var(--marks-reach) + 2px + 3px);
        background-image: linear-gradient(90deg, transparent 2px, var(--quiet) 2px 10px, transparent 10px);
        background-position: left bottom;
        background-repeat: round no-repeat;
        background-size: 12px 3px;
        box-decoration-break: clone;
      }

      #view[data-hover='underline'] :is(.diff-change, .diff-change-carried):has(.diff-small):hover:not(.diff-current) {
        --marks-reach: 0.12em;
      }

      /* 3. One yellow highlighter for any change, filled or not, as on paper. */
      #view[data-hover='marker'] :is(.diff-change, .diff-change-carried, .diff-tidied-letter):hover {
        background: hsl(52 100% 66%);
        box-shadow: 0 0 0 4px hsl(52 100% 66%);
      }
    </style>
  </head>
  <body>
    <div class="prototype-controls">
      <label>
        Primer
        <select id="sample"></select>
      </label>
      <button type="button" id="swap">Zameni polja</button>
      <label>
        <input type="checkbox" id="merging" checked />
        Spoji bliske izmene
      </label>
      <label>
        Sitne popravke
        <select id="tidying">
          <option value="coloured">Obojena slova</option>
          <option value="hidden">Skrivene</option>
          <option value="full">Kao ostale izmene</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="only-new" />
        Samo novi tekst
      </label>
      <label>
        Isticanje pod mišem
        <select id="hover">
          <option value="outline">Okvir (sada u aplikaciji)</option>
          <option value="lighter">1. Svetlije, i žuto iza zelenog</option>
          <option value="darker">2. Tamnije, i svetlozeleno iza zelenog</option>
          <option value="marker">3. Žuti marker za sve</option>
          <option value="buttons" selected>4. Kao dugmad: zatamnjeno, veća meta (izabrano)</option>
          <option value="underline">5. Kao 4, i siva isprekidana linija ispod</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="dark" />
        Tamno
      </label>
    </div>
    <div class="prototype-boxes">
      <label>
        Trenutno
        <textarea id="current" spellcheck="false"></textarea>
      </label>
      <label>
        Predlog
        <textarea id="proposed" spellcheck="false"></textarea>
      </label>
      <label>
        Rezultat
        <textarea id="result" spellcheck="false" readonly></textarea>
      </label>
    </div>
    <div id="view"></div>
    <div class="panel prototype-panel">
      <footer>
        <button type="button" id="apply" class="keep">Unesi izmene u tekst</button>
        <button type="button" id="close">Zatvori</button>
      </footer>
    </div>
    <script src="/diff-prototype.js"></script>
  </body>
</html>
