<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <title>Prototip razlika</title>
    <link rel="icon" href="/icon.svg" />
    <!--
      The diff view with two boxes to feed it, for finding out what it gets wrong
      and what it lacks. Not part of the app: served by scripts/serve.mjs at
      /diff-prototype, and its script is built into dist-browser/ only.

      The view's own look comes from the app's stylesheet, so what is seen here
      is what the app draws. Only this page's scaffolding is styled below. The
      looks tried here and chosen (2026-11-08: the hover line, square dots, the
      arrow, the legend, the bar's square sign) are the app's own now; the ones
      not chosen are in git, should one be wanted again.
    -->
    <link rel="stylesheet" href="/interface.css" />
    <!-- For the Lektor's "Izgled izmena" chooser above the text, drawn as its window draws it. -->
    <link rel="stylesheet" href="/lektor.css" />
    <style>
      body {
        flex-direction: column;
        gap: 0.6rem;
        box-sizing: border-box;
        padding: 0.8rem 1.2rem;
        background: var(--page);
        color: var(--ink);
      }

      /*
        Looks to try for the band the bar stands on (2026-11-11), each saying in its own way that
        the space is the control's and not a blank line of his. The app's own is "grey".
      */
      #view {
        --band-mark: color-mix(in srgb, var(--ink) 22%, transparent);
      }

      /* Thin diagonal strokes, as a drawing marks a cut-away: a space that is not part of the text. */
      #view[data-band-look='hatched'] .diff-bar-band::before {
        background: repeating-linear-gradient(-45deg, var(--band-mark) 0 1px, transparent 1px 7px);
      }

      #view[data-band-look='hatched-grey'] .diff-bar-band::before {
        background:
          repeating-linear-gradient(-45deg, var(--band-mark) 0 1px, transparent 1px 7px),
          var(--wash);
      }

      /* A fine grid of dots, as a work surface under a tool. */
      #view[data-band-look='dots'] .diff-bar-band::before {
        background:
          radial-gradient(circle, var(--band-mark) 1px, transparent 1.3px) 0 0 / 7px 7px,
          var(--wash);
      }

      /* Dashed lines above and below, as "cut here": the text opened to let something in. */
      #view[data-band-look='dashed'] .diff-bar-band::before {
        background: none;
        border-block: 1px dashed var(--quiet);
      }

      /* A track the bar runs in: solid lines above and below a shaded strip. */
      #view[data-band-look='rails'] .diff-bar-band::before {
        border-block: 1px solid var(--line);
      }

      /* A recess the bar sits down in, shaded deepest at its top edge. */
      #view[data-band-look='tray'] .diff-bar-band::before {
        background: color-mix(in srgb, var(--ink) 7%, transparent);
        box-shadow:
          inset 0 4px 5px -3px color-mix(in srgb, var(--ink) 30%, transparent),
          inset 0 -2px 3px -2px color-mix(in srgb, var(--ink) 18%, transparent);
      }

      /* The window's own soft blue, the colour of things that belong to the window and not the text. */
      #view[data-band-look='tinted'] .diff-bar-band::before {
        background: color-mix(in srgb, var(--chosen-soft) 70%, transparent);
      }

      /*
        The buttons straight on the band, with no panel of their own: the bar keeps its size, so
        the band is made as tall as ever, and only its white plate, edge and halo go. Chosen, on
        the grey band (Danilo, 2026-11-11): less disturbing, more in line with the text.
      */
      #view[data-bar-on-band] .diff-bar-band > .diff-bar {
        border-color: transparent;
        background: transparent;
        box-shadow: none;
        /* Back by the plate's padding and edge (interface.css, .stepper), so the first button, and
           not the plate no longer drawn, starts where the change does. */
        margin-left: calc(-0.4rem - 1px);
      }

      /*
        The change the bar is for on the band's own grey, hanging from it: its background
        reaches up through the line's spacing (measured, --band-join) to meet the band, and
        down to its dotted line. Its own background, so under its words and their marks.
      */
      /* The current change, bar or not (Danilo, 2026-11-11): with the bar put away, it stays on the grey. */
      #view[data-bar-room][data-change-on-band] .review-text .diff-current {
        /* How far the grey spills past the change at the sides, and below. */
        --spill: 4px;
        --spill-below: 5px;
        background-color: var(--wash);
        padding-top: var(--band-join, 0px);
        /* Further out at the sides and below (Danilo, 2026-11-11), overlapping what is there a
           little: borders in the same grey, taking no room. An inline box's borders above and
           below move no line, and those at the sides are given back by a margin as wide, so
           nothing moves. The background stops inside them, or the two greys would add up. */
        border: 0 solid var(--wash);
        border-width: 0 var(--spill) var(--spill-below);
        margin-inline: calc(-1 * var(--spill));
        background-clip: padding-box;
      }

      /* The change's grey reaching further left than its words, the bar is held back by as much, to keep to the words. */
      #view[data-bar-room][data-bar-on-band][data-change-on-band] .review-text:has(.diff-bar-over) .diff-bar-band > .diff-bar {
        margin-left: calc(-0.4rem - 1px + 4px);
      }

      /*
        Lighter looks to try for Vrati staro, Prihvati and Izmeni (2026-11-11), each keeping the
        tie to the colour of its wording in a lighter form, and the sign of the one in effect.
        --choice-fill is the wording's colour (interface.css); --choice-shown is what the
        button is filled with, which the chosen sign's inner gap is drawn in.
      */
      #view[data-button-look] .diff-bar .diff-bar-choice,
      #view[data-button-look] .diff-bar .diff-bar-choice:hover:not(:disabled) {
        background-image: none;
      }

      /* An ordinary button, its colour a stripe along the bottom; thicker for the one in effect. */
      #view[data-button-look='underlined'] .diff-bar .diff-bar-choice {
        --choice-shown: var(--panel);
        border-color: var(--line);
        background-color: var(--panel);
        color: var(--ink);
        box-shadow: inset 0 -3px 0 var(--choice-fill);
      }

      #view[data-button-look='underlined'] .diff-bar .diff-bar-chosen {
        box-shadow: inset 0 -5px 0 var(--choice-fill);
      }

      #view[data-button-look='underlined'] .diff-bar .diff-bar-choice:hover:not(:disabled) {
        --choice-shown: var(--toolbar);
        border-color: var(--line);
        background-color: var(--toolbar);
      }

      /* No button at all: a round radio in the wording's colour, and the words beside it. */
      #view[data-button-look='radio'] .diff-bar .diff-bar-choice {
        --choice-shown: transparent;
        border-color: transparent;
        background-color: transparent;
        color: var(--ink);
      }

      #view[data-button-look='radio'] .diff-bar .diff-bar-dot {
        border-radius: 50%;
        border-color: var(--choice-fill);
      }

      #view[data-button-look='radio'] .diff-bar .diff-bar-chosen .diff-bar-dot {
        background: radial-gradient(circle, var(--choice-fill) 0 34%, transparent 38%);
        box-shadow: none;
      }

      #view[data-button-look='radio'] .diff-bar .diff-bar-choice:hover:not(:disabled) {
        border-color: transparent;
        background-color: var(--wash);
      }

      /* The wording's colour, faint, with words and sign in its full strength. */
      #view[data-button-look='pale'] .diff-bar .diff-bar-choice {
        --choice-shown: color-mix(in oklch, var(--choice-fill) 14%, var(--panel));
        border-color: color-mix(in oklch, var(--choice-fill) 40%, var(--panel));
        background-color: var(--choice-shown);
        color: var(--choice-fill);
      }

      #view[data-button-look='pale'] .diff-bar .diff-bar-choice:hover:not(:disabled) {
        --choice-shown: color-mix(in oklch, var(--choice-fill) 24%, var(--panel));
        border-color: var(--choice-fill);
        background-color: var(--choice-shown);
      }

      /*
        A grey button with its wording's colour at full strength: a bar down its left side, an
        outline all round, and its words and radio. Picked for now (Danilo, 2026-11-12), with
        standard round radios.
      */
      /* No fill of its own, so the band's grey shows through: the same grey (Danilo, 2026-11-12). */
      #view[data-button-look='side-bar'] .diff-bar {
        --side-bar: 7px;
        --between: 0.6rem;
        gap: var(--between);
      }

      /* Each button's target reaches half the way to the next, so the wider space between
         them still has no gap a click falls into; past the thick edge on the left. */
      #view[data-button-look='side-bar'] .diff-bar button::before {
        right: calc(var(--between) / -2 - 1px);
        left: calc(var(--between) / -2 - 1px);
      }

      #view[data-button-look='side-bar'] .diff-bar .diff-bar-choice::before {
        left: calc(var(--between) / -2 - var(--side-bar));
      }

      #view[data-button-look='side-bar'] .diff-bar > .diff-bar-choice:first-child::before {
        left: calc(-0.4rem - var(--side-bar));
      }

      /* The X has a little margin of its own before it (interface.css), which its reach covers too. */
      #view[data-button-look='side-bar'] .diff-bar > button:last-child::before {
        right: calc(-0.4rem - 1px);
        left: calc(var(--between) / -2 - 1px - 0.2rem);
      }

      #view[data-button-look='side-bar'] .diff-bar .diff-bar-choice {
        --choice-shown: transparent;
        border: 1px solid var(--choice-fill);
        border-left-width: var(--side-bar);
        background-color: transparent;
        color: var(--choice-fill);
      }

      /* A shade darker under the pointer: the band's wash once more. */
      #view[data-button-look='side-bar'] .diff-bar .diff-bar-choice:hover:not(:disabled) {
        --choice-shown: var(--wash);
        border-color: var(--choice-fill);
        background-color: var(--wash);
      }

      /* The words straight after the radio, not centred in what is left of the button. */
      #view[data-button-look='side-bar'] .diff-bar .diff-bar-dot {
        margin-right: 0;
        border-radius: 50%;
      }

      #view[data-button-look='side-bar'] .diff-bar .diff-bar-choice::after {
        content: none;
      }

      #view[data-button-look='side-bar'] .diff-bar .diff-bar-chosen .diff-bar-dot {
        background: radial-gradient(circle, currentColor 0 34%, transparent 38%);
        box-shadow: none;
      }

      /* A plain button with the colour as its edge and its words. */
      #view[data-button-look='outlined'] .diff-bar .diff-bar-choice {
        --choice-shown: var(--panel);
        border: 1.5px solid var(--choice-fill);
        background-color: var(--panel);
        color: var(--choice-fill);
      }

      #view[data-button-look='outlined'] .diff-bar .diff-bar-choice:hover:not(:disabled) {
        --choice-shown: color-mix(in oklch, var(--choice-fill) 10%, var(--panel));
        border-color: var(--choice-fill);
        background-color: var(--choice-shown);
      }

      /* Only the words and the sign, in the wording's colour. */
      #view[data-button-look='text'] .diff-bar .diff-bar-choice {
        --choice-shown: transparent;
        border-color: transparent;
        background-color: transparent;
        color: var(--choice-fill);
        font-weight: 600;
      }

      #view[data-button-look='text'] .diff-bar .diff-bar-choice:hover:not(:disabled) {
        border-color: transparent;
        background-color: var(--wash);
      }

      /* With nothing behind it but the band, the sign's inner square is drawn smaller rather than ringed in a colour. */
      #view[data-button-look='text'] .diff-bar .diff-bar-chosen .diff-bar-dot {
        background: linear-gradient(currentColor, currentColor) center / 40% 40% no-repeat;
        box-shadow: none;
      }

      /* As the Lektor's window sizes the lines above its text (lektor.css, .lektor-window .review-body). */
      .lektor-review-head {
        margin-bottom: 0.75rem;
        font-family: var(--ui-font);
        font-size: calc(var(--ui-size) * 0.85);
        line-height: normal;
      }

      .lektor-review-head * {
        font-size: inherit;
        line-height: inherit;
      }

      .lektor-review-head p {
        margin: 0;
      }

      .prototype-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
      }

      .prototype-header {
        flex: none;
      }

      .prototype-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 0.5rem 1.5rem;
        border-bottom: 1px solid var(--line);
      }

      .prototype-sample {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        min-width: 0;
        padding-bottom: 0.4rem;
      }

      /* Long names cut short when closed; the open list still shows them whole. */
      .prototype-sample select {
        max-width: min(24rem, 60vw);
      }

      .prototype-controls select {
        max-width: 10rem;
      }

      .prototype-tabs {
        display: flex;
        gap: 0.2rem;
      }

      /* A tab: the open one joined to its panel below, and clicked again it folds away. */
      .prototype-tabs button {
        margin-bottom: -1px;
        padding: 0.35rem 0.9rem;
        border: 1px solid transparent;
        border-radius: 6px 6px 0 0;
        background: none;
        color: var(--quiet);
      }

      .prototype-tabs button[aria-selected='true'] {
        border-color: var(--line);
        border-bottom-color: var(--page);
        color: var(--ink);
        font-weight: 600;
      }

      /* One height whichever tab is open, so the diff under it stays put. */
      .prototype-tab-panel {
        box-sizing: border-box;
        height: 6.6rem;
        padding: 0.5rem 0 0.6rem;
        overflow: auto;
        border-bottom: 1px solid var(--line);
      }

      /* As tall as its controls need, at any width: held to the boxes' height, it scrolled. */
      .prototype-controls.prototype-tab-panel {
        height: auto;
        overflow: visible;
        align-items: start;
        gap: 0.5rem 1.5rem;
      }

      /* A column of controls: the names of the lists in one column and the lists
         lined up in the next; a checkbox, its own name and all, across both. */
      .prototype-column {
        display: grid;
        grid-template-columns: auto auto;
        align-items: center;
        gap: 0.45rem 0.6rem;
      }

      .prototype-column > label {
        grid-column: 1 / -1;
      }

      .prototype-column > .prototype-pick {
        display: contents;
      }

      .prototype-tab-panel[hidden] {
        display: none;
      }

      .prototype-controls button {
        padding: 0.25rem 0.7rem;
      }

      .prototype-controls label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      /* The footer of a real dialog, so that its buttons are those of one. The rest of
         a dialog's panel has no business on this page. */
      .prototype-panel {
        flex: none;
        width: 100%;
        padding: 0;
        border: 0;
        box-shadow: none;
        overflow: visible;
      }

      .prototype-panel footer {
        margin-top: 0;
        padding: 0.4rem 0 0;
        border-top: 0;
      }

      .prototype-boxes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.8rem;
      }

      .prototype-box {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        min-height: 0;
      }

      .prototype-box label {
        font-weight: 600;
      }

      .prototype-box-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }

      .prototype-box-title button {
        padding: 0 0.5rem;
        font-size: 0.8em;
      }

      .prototype-boxes textarea {
        box-sizing: border-box;
        width: 100%;
        flex: 1;
        min-height: 0;
        padding: 0.5rem 0.7rem;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--page);
        color: var(--ink);
        font-family: var(--writing-font);
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.4;
      }

      #view {
        flex: 1;
        min-height: 12rem;
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="prototype-header">
      <div class="prototype-bar">
        <label class="prototype-sample">
          Primer
          <select id="sample"></select>
        </label>
        <div class="prototype-tabs" role="tablist" aria-label="Podešavanja prototipa">
          <button type="button" role="tab" aria-selected="false" aria-controls="tab-showing" data-tab="showing">Prikaz</button>
          <button type="button" role="tab" aria-selected="false" aria-controls="tab-texts" data-tab="texts">Tekstovi</button>
        </div>
      </div>
      <div class="prototype-controls prototype-tab-panel" id="tab-showing" role="tabpanel" hidden>
        <div class="prototype-column">
          <label class="prototype-pick">
            <span>Sitne popravke</span>
            <select id="tidying">
              <option value="coloured">Obojena slova</option>
              <option value="hidden">Skrivene</option>
              <option value="full">Kao ostale izmene</option>
            </select>
          </label>
          <label>
            <input type="checkbox" id="merging" checked />
            Spoji bliske izmene
          </label>
          <label>
            <input type="checkbox" id="only-new" />
            Tekst kakav će biti
          </label>
          <label title="Bez trake nad izmenama i bez odluka, kako stoji u Ranijim verzijama">
            <input type="checkbox" id="read-only" />
            Samo za čitanje
          </label>
        </div>
        <div class="prototype-column">
          <label title="Legenda i broj izmena, kako ih AI Lektor piše iznad teksta">
            <input type="checkbox" id="preamble" checked />
            Redovi iznad teksta
          </label>
          <label>
            <input type="checkbox" id="dark" />
            Tamno
          </label>
        </div>
        <div class="prototype-column">
          <label title="Traka nad izmenom razmakne redove umesto da pokrije red iznad">
            <input type="checkbox" id="bar-room" checked />
            Prostor za traku
          </label>
          <label title="Pojas se otvara i zatvara polako, pa tekst iznad klizi umesto da skoči">
            <input type="checkbox" id="band-motion" />
            Pomeranje polako
          </label>
          <label title="Dugmad stoje pravo na pojasu, bez bele ploče oko njih">
            <input type="checkbox" id="bar-on-band" checked />
            Dugmad na pojasu
          </label>
          <label title="Izmena nad kojom je traka dobija istu pozadinu kao pojas, spojenu s njim">
            <input type="checkbox" id="change-on-band" checked />
            Izmena na pojasu
          </label>
        </div>
        <div class="prototype-column">
          <label class="prototype-pick" title="Kako izgledaju Vrati staro, Prihvati i Izmeni">
            <span>Izgled dugmadi</span>
            <select id="button-look">
              <option value="filled">Pune boje (sada)</option>
              <option value="underlined">Obična, podvučena bojom</option>
              <option value="radio">Radio u boji</option>
              <option value="pale">Bleda boja</option>
              <option value="side-bar">Siva, s bojom sa strane</option>
              <option value="outlined">Obrub u boji</option>
              <option value="text">Samo tekst u boji</option>
            </select>
          </label>
          <label class="prototype-pick" title="Kako izgleda prostor otvoren za traku">
            <span>Izgled pojasa</span>
            <select id="band-look">
              <option value="grey">Siva (kao sada)</option>
              <option value="hatched">Šrafura</option>
              <option value="hatched-grey">Šrafura na sivom</option>
              <option value="dots" selected>Tačkice</option>
              <option value="dashed">Isprekidane ivice</option>
              <option value="rails">Šina</option>
              <option value="tray">Udubljenje</option>
              <option value="tinted">Plavičasta</option>
            </select>
          </label>
        </div>
      </div>
      <div class="prototype-boxes prototype-tab-panel" id="tab-texts" role="tabpanel" hidden>
        <div class="prototype-box">
          <label for="current">Trenutno</label>
          <textarea id="current" spellcheck="false"></textarea>
        </div>
        <div class="prototype-box">
          <label for="proposed">Predlog</label>
          <textarea id="proposed" spellcheck="false"></textarea>
        </div>
        <div class="prototype-box">
          <div class="prototype-box-title">
            <label for="result">Rezultat</label>
            <button type="button" id="swap" title="Zameni tekst u poljima Trenutno i Predlog">Zameni polja</button>
          </div>
          <textarea id="result" spellcheck="false" readonly></textarea>
        </div>
      </div>
    </div>
    <div id="view"></div>
    <div class="panel prototype-panel">
      <footer>
        <button type="button" id="apply" class="keep">Unesi izmene u tekst</button>
        <button type="button" id="close">Zatvori</button>
      </footer>
    </div>
    <script src="/diff-prototype.js"></script>
  </body>
</html>
