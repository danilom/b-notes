<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <title>Prototip izbora Lektora</title>
    <link rel="icon" href="/icon.svg" />
    <!--
      The Lektor as it could be once paid goes through OpenRouter with a model for each kind of
      correction: the panel for choosing free or paid and reading the comment, and one modal window
      for all of the corrections, from choosing the Lektor and the kind to the review. Nothing real behind it:
      switches above the panel set each case. The text in it is made up: this file is public.

      Not part of the app: served by scripts/serve.mjs at /lektor-choice-prototype, and its script
      is built into dist-browser/ only. The panel's look is the app's own stylesheet, so what is
      seen is what the app would draw; the few new pieces are styled below, marked as new.
    -->
    <link rel="stylesheet" href="/interface.css" />
    <link rel="stylesheet" href="/lektor.css" />
    <style>
      /*
        The page is the app's window: shown at his screens' sizes by /his-screens?page=lektor-choice-prototype,
        whose column beside the screen holds this page's switches (prototypeControls below), so nothing here
        but what he would see. The list, the text and the panel are stand-ins drawn with the app's colours,
        the panel as wide as the list and never more than a third of the window, as the app has them.
      */
      body {
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: var(--page);
        color: var(--ink);
      }

      .prototype-app {
        --side-width: min(22rem, 33.3vw);
        height: 100vh;
        display: grid;
        grid-template-columns: var(--side-width) minmax(0, 1fr) var(--side-width);
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 0;
      }

      .prototype-list {
        grid-row: 1 / -1;
      }

      /*
        A stand-in for the app's bottom bar, which with the Lektor open runs under the text and the
        panel but not the list, and takes their height: 48 px on his Asus, measured in the app. Without
        it the panel here had 48 px more room than his.
      */
      .prototype-status {
        grid-column: 2 / -1;
        grid-row: 2;
        height: 48px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.4rem;
        padding: 0 1rem;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }

      body.lektor-open .prototype-app #lektor-side {
        grid-column: 3;
      }

      .prototype-list {
        overflow: hidden;
        padding: 0.8rem 1rem;
        border-right: 1px solid var(--line);
        background: var(--panel);
        color: var(--quiet);
        font-size: 0.95rem;
      }

      .prototype-list p {
        margin: 0;
        padding: 0.35rem 0;
      }

      .prototype-list .prototype-open {
        margin: 0 -1rem;
        padding: 0.35rem 1rem;
        background: var(--chosen-soft);
        color: var(--ink);
      }

      .prototype-text {
        overflow: hidden;
        padding: 1.6rem 2rem;
        font-family: Georgia, serif;
        font-size: 1.15rem;
        line-height: 1.75;
      }

      .prototype-text p {
        max-width: 34em;
        margin: 0 0 1em;
      }

      /* New: the heading on the left and the way to the keys on the right, on one baseline. */
      .lektor-choice-with-keys {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.6rem;
      }

      .lektor-choice-with-keys > .lektor-heading {
        margin: 0;
      }

      /*
        New: radios set in a little from their heading, as Windows sets them, now there is room; and
        what is said under a radio starts where its words or mark do: the radio, then the 0.4rem gap
        .lektor-preset puts after it.
      */
      :root {
        --lektor-radio-indent: 0.5rem;
        --lektor-after-radio: calc(var(--lektor-radio) + 0.4rem);
      }

      /*
        Up into the first and last rows' padding, so a list sits as close to its heading and to what
        follows as before the rows grew: the padding is for the hand, not more space for the eye.
      */
      .lektor-choice-options,
      .lektor-kind-list {
        /* Less at the top: tall rows under a heading need a little air below it. */
        margin-top: -0.25rem;
        margin-bottom: -0.45rem;
      }

      /* A little more before the warning than between the lines above it: it is the last thing before sending. */
      .lektor-side-body > .lektor-side-foot {
        margin-top: 0.4rem;
      }

      /* More room above a heading than under it, so each heading reads as starting what follows. */
      .lektor-side-body > .lektor-choice-with-keys,
      .lektor-window-side > .lektor-heading:not(:first-child) {
        margin-top: 0.4rem;
      }

      .lektor-choice-options {
        display: flex;
        flex-direction: column;
        padding-left: var(--lektor-radio-indent);
      }

      /*
        New: each choice a target about as tall as a button and as wide as its column, for an old
        man's hand: the space between the rows is the rows' own padding, so all of it can be clicked.
      */
      .lektor-choice-options .lektor-preset,
      .lektor-kind .lektor-preset {
        /* Out to the column's edge, under the heading's first letter, and padded back in, so the radio stays set in while the target and its tint reach the margin. */
        margin: 0 0 0 calc(-1 * var(--lektor-radio-indent));
        /* Above and below, what a row of his list has, so the two are as tall. */
        padding: 0.5rem 0.35rem 0.5rem var(--lektor-radio-indent);
        border-radius: 4px;
        /* A line said about the choice (the balance, "Spremno") wraps onto a line of its own inside the row. */
        flex-wrap: wrap;
        row-gap: 0.2rem;
      }

      /* Under the words or mark, a column with them; the radio stays on the first line. */
      .lektor-preset > :is(.lektor-balance, .lektor-kind-about) {
        flex-basis: 100%;
        margin: 0 0 0 var(--lektor-after-radio);
      }

      /* The app's own hover, the wash a row of his list gets, so the whole target shows; not on one that can't be chosen. */
      .lektor-choice-options .lektor-preset:has(input:enabled):hover,
      .lektor-kind .lektor-preset:has(input:enabled):hover {
        background-image: linear-gradient(var(--wash), var(--wash));
      }

      .lektor-choice-with-keys .lektor-again {
        font-size: var(--lektor-small);
        /* Taller than the heading's words: hanging below them, it would push the choices down here and not in the window. */
        margin-bottom: -0.2rem;
      }

      /* New: the balance, small and quiet, in Plaćeni's row. */
      .lektor-balance {
        font-size: var(--lektor-small);
        color: var(--quiet);
      }

      /* New: where the text goes and, if shown, what it costs, beside the send button. */
      .lektor-where {
        font-size: var(--lektor-small);
        color: var(--quiet);
      }

      /* New: a balance under $1 in the app's red, with "malo" after it: the only warning about money. */
      .lektor-balance-low {
        color: var(--danger);
      }

      /* New: the free and paid marks, beside the choice and on the buttons that send, the size of the service marks. */
      .lektor-choice-mark {
        flex: none;
        width: 1.05em;
        height: 1.05em;
      }

      /* The app's accent hue, as light as the coin's gold (luminance about 0.21), so neither mark looks the weightier. */
      .lektor-choice-mark-free {
        color: #3380d6;
      }

      .lektor-choice-mark-paid {
        color: #a87412;
      }

      /* On a filled button the mark takes the button's own words' colour. */
      .lektor-main-action .lektor-choice-mark {
        color: inherit;
      }

      /* The stand-in for the review: who wrote it, the model and the cost, then where the review would be. */
      .lektor-review-ran {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .lektor-review-ran p {
        margin: 0;
      }

      /*
        New: the corrections window in two columns: his decisions on the left, what belongs to the kind
        picked on the right. The window keeps the review's size, so it doesn't jump when the review comes.
      */
      .lektor-window-side,
      .lektor-window-detail {
        /* Room under the header's line, so the first heading starts the choices rather than continuing the title. */
        padding-top: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        overflow-y: auto;
        /*
          The Lektor's own three, and no others: its words at this size, headings the same size in
          bold, and its small print in grey. Near-equal sizes side by side read as carelessness.
        */
        font-size: var(--lektor-text);
      }

      .lektor-window-side {
        flex: none;
        width: 20rem;
      }

      /*
        New: the kind picked marked as Ranije verzije marks the version open (.row-open), the stripe
        and the soft blue, the radio kept since these are fixed choices; square, as those rows are,
        since a stripe on a rounded corner looks broken.
      */
      .lektor-kind .lektor-preset {
        border-radius: 0;
      }

      .lektor-kind .lektor-preset:has(input:checked) {
        box-shadow: inset 3px 0 0 var(--chosen);
        background-color: var(--chosen-soft);
      }

      .lektor-window-detail {
        flex: 1;
        min-width: 0;
        padding-left: 1rem;
        border-left: 1px solid var(--line);
      }

      /* No gap between the columns: the kind picked runs right up to the dividing line, as a tab into what it opens. */
      .lektor-window .review-panes:has(> .lektor-window-detail) {
        gap: 0;
      }

      /* No weight of its own (:where), so a piece shared with the panel, as the balance's indent, keeps its own margins. */
      :where(.lektor-window-side > *, .lektor-window-detail > *, .lektor-kind > *) {
        margin: 0;
      }

      /* The kinds in a list of their own, spaced only by their padding; set in like the Lektor choice, so the window's two groups of radios look alike. */
      .lektor-kind-list {
        display: flex;
        flex-direction: column;
        padding-left: var(--lektor-radio-indent);
      }

      /*
        Read-only, and looking it beside his white note box. In the panel that is done by no fill, the
        panel being grey; in the white window it is the other way round, the panel's grey as its fill
        and no frame, so it reads as something shown, not a box to type in. It takes the room the
        column has to spare, so as much of the instruction shows as fits, and scrolls past that;
        never more than its words, so no empty grey under them.
      */
      .lektor-window-detail .lektor-prompt {
        flex: 0 1 auto;
        min-height: 6em;
        overflow-y: auto;
        border-color: transparent;
        background: var(--panel);
      }

      /* His own box keeps its four lines: where room is short, the instruction scrolls, not what he writes. */
      .lektor-window-detail .lektor-note {
        flex: none;
      }

      /*
        Bold and at the top, no size of its own; in the colour the window's title gives the name of
        what it is about (.heading-name), since this names what the right side is about, and ties it
        to the blue of the kind picked.
      */
      .lektor-window-kind-title {
        font-weight: 600;
        color: var(--chosen-ink);
      }

      /* New: under a kind's name, how far it goes: small and quiet, part of the row's target. */
      /* The Lektor's small print: there to read the first time, out of the way of the names by the twentieth. */
      .lektor-kind-about {
        font-size: var(--lektor-small);
        line-height: 1.35;
        color: var(--quiet);
      }

      /* What of his text stays his, on a line of its own, which sets it apart enough: down the list these lines are the scale he chooses on. */
      .lektor-kind-keeps {
        display: block;
      }

      /* New: a thin line before Dubinska prerada, a pause rather than a box: it replaces his text where the others fix it. */
      .lektor-kind-divider {
        width: 100%;
        margin: 0.45rem 0;
        border: none;
        border-top: 1px solid var(--line);
      }

      /* New: "preporučeno" after the choice that is better for this kind. */
      .lektor-recommended {
        font-size: var(--lektor-small);
        color: var(--quiet);
      }

      /* New: corrections ready for the kind picked, one card each: whose, from when, what it cost, and the way in. */
      .lektor-ready-card {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.7rem;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      /* In the colour of the kinds' names, not grey: it is what he came to open. */
      .lektor-ready-words {
        color: inherit;
      }

      .lektor-ready-card button {
        margin-left: auto;
      }

      /* Asking again past ready corrections: plain, the way past rather than the way on; it opens the form, sends nothing. */
      .lektor-ask-again {
        align-self: flex-start;
        margin-top: 0.4rem;
      }

      /* New: sending, at the foot of the right column, at its right, as a window's main button stands. */
      .lektor-window-actions {
        margin-top: auto;
        padding-bottom: 0.2rem;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.6rem;
      }

      .lektor-window-actions .lektor-back-to-ready {
        margin-right: auto;
      }

      /*
        Every button in the window the size of the dialog's own (.panel footer button), so all are one
        height and one size of words. Looking at corrections and sending are the Lektor's solid blue
        (.lektor-main-action), as its next step is in the panel; the rest as the dialog has them.
      */
      .lektor-window-detail button {
        min-width: 6.5rem;
        padding: 0.5rem 1rem;
        /* The dialog's own size (.panel), not the column's or the big panel's they sit in. */
        font-size: calc(var(--ui-size) * 0.85);
        /* The Lektor's solid style lays its words out as a row (for a mark beside them); at the dialog's least width they'd sit at the left. */
        justify-content: center;
      }

      .lektor-window-ways {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.8rem;
      }

      /* Nothing chosen yet: the right side only points left. */
      /* Both classes: it borrows the big panel's centring, not its size; set as the kinds' names are, so no fourth style. */
      .lektor-window-big.lektor-window-empty {
        color: inherit;
        font-size: var(--lektor-text);
      }

      /* New: the wait and a failure fill the right column, centred and large: while either lasts it is all there is. */
      .lektor-window-big {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 1rem;
        text-align: center;
        font-size: 1.1rem;
      }

      .lektor-window-big > * {
        margin: 0;
      }

      /*
        New: the wait, in four styles and no more: the Lektor's words (the kind, the stages), a heading
        in bold at that size (the text's name), its small grey print (times, model, notes), and the
        clock, big, as the one thing to glance at.
      */
      /*
        Pinned to the top, where the form's title was: a new stage adds a line below and nothing he has
        read moves. Centred top to bottom, each new line shifted the whole block up.
      */
      .lektor-window-wait {
        justify-content: flex-start;
        padding: 0;
        font-size: var(--lektor-text);
        color: var(--ink);
      }

      /* One column, one left edge, narrow enough that each stage's time sits near its words. */
      .lektor-wait-column {
        width: min(22rem, 100%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
        text-align: left;
      }

      .lektor-wait-column > * {
        margin: 0;
      }

      .lektor-wait-column .lektor-stages {
        width: 100%;
        /* No room of its own below: the clock's spacing alone decides it, the same whatever the last stage shows. */
        margin-bottom: 0;
      }

      .lektor-wait-name {
        color: var(--chosen-ink);
      }

      /*
        The clock's room, the same whatever comes before it (the queue's note, the bar, a stage), and
        a little more below than above to look even: a big face has room of its own above its capitals,
        and its lowercase letters sit heavy at the bottom.
      */
      .lektor-wait-column .lektor-window-clock {
        margin: 0.5rem 0 0.95rem;
      }

      .lektor-window-clock {
        font-size: 2rem;
        font-variant-numeric: tabular-nums;
      }

      .lektor-wait-small {
        max-width: 28rem;
        font-size: var(--lektor-small);
        color: var(--quiet);
      }

      /* The stages as a list, each with its mark and, once over, how long it took. */
      .lektor-stages {
        width: min(28rem, 100%);
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        margin: 0.4rem 0;
        text-align: left;
      }

      /*
        The marks hang out in the margin, so every line of text, the bar and the notes share one left
        edge, and the marks make a column of their own beside it.
      */
      .lektor-stage {
        display: grid;
        grid-template-columns: 1.4em minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.5rem;
        margin-left: calc(-1.4em - 0.5rem);
      }

      /* A: the time follows its words after a middle dot, so the row is the mark and one run of words. */
      .lektor-stages-dot .lektor-stage {
        grid-template-columns: 1.4em minmax(0, 1fr);
      }

      /* B: the time at the right, a row of small dots leading the eye from the words to it. */
      .lektor-stages-leader .lektor-stage {
        grid-template-columns: 1.4em auto minmax(1.5rem, 1fr) auto;
      }

      .lektor-stage-leader {
        align-self: stretch;
        background: radial-gradient(circle, var(--quiet) 0.9px, transparent 1.3px) left 0.95em / 6px 4px repeat-x;
        opacity: 0.7;
      }

      .lektor-stage-mark {
        display: flex;
        justify-content: center;
        color: var(--chosen-ink);
      }

      .lektor-stage-time {
        font-size: var(--lektor-small);
        color: var(--quiet);
        white-space: nowrap;
      }

      /* Said about the stage going on, under its words, gone when it ends: the queue's why and its limit. */
      /* No paragraph space below: it would push the clock down only while the queue lasts. */
      .lektor-stage-note {
        margin: -0.2rem 0 0;
      }

      /* The bar under the stage it measures, at the shared edge, so it can't be read as the whole wait's. */
      .lektor-stage-progress {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.5rem;
      }

      /* New: how far the writing has got, a plain bar in the app's blue. */
      .lektor-progress {
        width: 100%;
        height: 0.5rem;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }

      .lektor-progress-done {
        height: 100%;
        background: var(--chosen);
        transition: width 0.3s;
      }

      .lektor-window-big .lektor-problem {
        max-width: 28rem;
        text-align: left;
      }

      .lektor-window-big .lektor-problem p {
        font-size: 1.15rem;
      }

      .lektor-window-big .lektor-problem .lektor-where {
        margin-top: 0.5rem;
        font-size: 0.95rem;
      }

      .lektor-window-big .lektor-problem svg {
        width: 2em;
        height: 2em;
      }

      /* New: the main button in a strip of its own at the panel's foot, always in view, with what scrolls above it. */
      /*
        Under the button as much room as over it (the strip's 0.5rem below its line, lektor.css), so it
        sits evenly between that line and the bottom bar's edge under the panel.
      */
      .lektor-side-dock {
        flex: none;
        padding: 0 1rem 0.5rem;
      }

      .lektor-side-dock .lektor-side-buttons {
        margin-top: 0;
        align-items: center;
      }

      /* A step back at the strip's left end, the main button staying on the right; the same size as it. */
      .lektor-side-dock .lektor-side-back {
        margin-right: auto;
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
      }

      .lektor-side-back svg {
        width: 1.1em;
        height: 1.1em;
      }

      /* The gift and coin in the "AI Lektor:" line, spaced and set on the line as the app sets its service marks there. */
      .lektor-service-line .lektor-choice-mark {
        display: inline-block;
        margin-right: 0.3em;
        vertical-align: -0.17em;
      }

      /* New on the keys screen: each key named after the choice it opens, with its mark, and a saved key said in words. */
      /* Room above each key's name, so each key reads as a group: its name, its box and its line. */
      .lektor-key-label {
        display: flex;
        align-items: center;
        gap: 0.35em;
        margin-top: 0.6rem;
      }

      /* What the box says about itself, in italics so it can't be taken for a key that's there. */
      .lektor-key::placeholder {
        font-style: italic;
      }

      .lektor-key-state {
        margin-top: -0.35rem;
        font-size: var(--lektor-small);
        color: var(--quiet);
      }

      .lektor-window .lektor-sends {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35em;
      }

      .lektor-window .lektor-sends svg {
        width: 1.05em;
        height: 1.05em;
      }
    </style>
  </head>
  <body class="lektor-open">
    <div class="prototype-app">
      <!-- Stand-ins for his list and his text, made up: this file is public. -->
      <div class="prototype-list">
        <p class="prototype-open">Probni tekst</p>
        <p>Pismo prijatelju</p>
        <p>Stari most</p>
        <p>Zimska bilješka</p>
        <p>Kod mora</p>
      </div>
      <div class="prototype-text" id="prototype-text"></div>
      <aside id="lektor-side"></aside>
      <!-- Stand-in for the app's bottom bar: its height, its place, its buttons' names; nothing behind them. -->
      <div class="prototype-status">
        <button type="button" class="status-action" disabled>Kopiraj ceo tekst</button>
        <button type="button" class="status-action" disabled>Ranije verzije</button>
        <button type="button" class="status-action" disabled>AI Lektor</button>
      </div>
    </div>

    <!-- The app's own: the window all of the corrections happen in, modal, so the text can't be edited under it. -->
    <dialog id="lektor-dialog"></dialog>

    <script src="/lektor-choice-prototype.js"></script>
  </body>
</html>
