<!doctype html>
<html lang="sr" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lektor: slike za meni</title>
    <link rel="icon" href="/icon.svg" />
    <!--
      Choosing the pictures for the Lektor panel's menu: not part of the app, built into
      dist-browser/ only. The app's stylesheet for its colours and fonts, the pictures' own for theirs.
    -->
    <link rel="stylesheet" href="/interface.css" />
    <link rel="stylesheet" href="/lektor-menu-pictures.css" />
    <style>
      /* A plain page, not the app's: its body is a flex row and a window's height, for the list and the text. */
      html,
      body {
        height: auto;
      }

      body {
        display: block;
        margin: 0;
        padding: 1rem 1.5rem 2rem;
        background: var(--page);
        color: var(--ink);
        font-family: var(--ui-font);
      }

      .sheet-bar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1.5rem;
        padding: 0.6rem 0;
        background: var(--page);
        border-bottom: 1px solid var(--line);
      }

      .sheet-bar h1 {
        margin: 0 1rem 0 0;
        font-size: 1.1rem;
      }

      .sheet-control select {
        margin-left: 0.3rem;
        font: inherit;
      }

      .sheet-group h2 {
        margin: 1.5rem 0 0.6rem;
        font-size: 1rem;
      }

      /* The two menu choices at the panel's size, as in the prototype. */
      /* As wide as the choices are in the panel on his Asus (351px each), so lines wrap where they would there. */
      .sheet-menu {
        /* The cards 351px; the panel's own padding and edge around them. */
        width: calc(351px + 1.6rem + 2px);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1rem;
        padding: 0.8rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 16.5px;
      }

      .sheet-menu-option {
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 0.7rem;
        align-items: center;
        padding: 0.6rem 0.75rem;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .sheet-menu-picture {
        grid-row: span 2;
        width: 40px;
        height: 40px;
      }

      .sheet-menu-name {
        font-weight: 700;
      }

      .sheet-menu-does {
        grid-column: 2;
        font-size: 13px;
        color: var(--quiet);
      }

      .sheet-top {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 1rem 2rem;
      }

      /* The utisak's "Ispravke…" candidates, at the strip's size, each named under it. */
      .sheet-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 1.5rem;
        margin-top: 1rem;
        padding: 0.8rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .sheet-button-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
      }

      .sheet-button {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
        min-height: 2.1rem;
        padding-inline: 0.8rem;
        font-size: 15px;
        white-space: nowrap;
      }

      .sheet-button .sheet-button-mini {
        flex: none;
        width: 1.7em;
        height: 1.7em;
        margin-block: -0.2em;
      }

      .sheet-button .sheet-button-icon {
        flex: none;
        width: 1.35em;
        height: 1.35em;
      }

      /* As in the panel: the page's top standing on the button's lower edge, as far from its left as its top. */
      .sheet-button.sheet-button-with-top {
        --page-top-inset: 0.3em;
        position: relative;
        padding-left: calc(var(--page-top-inset) + (2.1rem - var(--page-top-inset)) * 34 / 33 + 0.4em);
      }

      .sheet-button .sheet-button-page-top {
        position: absolute;
        left: var(--page-top-inset);
        bottom: 0;
        height: calc(100% - var(--page-top-inset));
        width: auto;
        aspect-ratio: 34 / 33;
      }

      .sheet-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .sheet-tile {
        width: 9.5rem;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 0.4rem;
        padding: 0.7rem;
        background: var(--page);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .sheet-tile-chosen {
        border-color: var(--chosen);
        box-shadow: 0 0 0 2px var(--chosen-soft);
      }

      .sheet-big {
        width: 96px;
        height: 96px;
      }

      .sheet-small {
        width: 40px;
        height: 40px;
      }

      .sheet-label {
        grid-column: 1 / -1;
        font-size: 13px;
        color: var(--quiet);
      }

      /* The sheet scrolls sideways on its own where the window is narrow, not the whole page. */
      .sheet-table-scroll {
        overflow-x: auto;
      }

      .sheet-table {
        border-collapse: collapse;
      }

      .sheet-table th {
        padding: 0 0.4rem 0.4rem;
        max-width: 6rem;
        font-size: 12px;
        font-weight: 400;
        color: var(--quiet);
        vertical-align: bottom;
      }

      .sheet-table th[scope='row'] {
        text-align: right;
        white-space: nowrap;
      }

      .sheet-table td {
        padding: 0.3rem 0.4rem;
        text-align: center;
      }

      .sheet-table .sheet-divide {
        border-left: 1px solid var(--line);
      }

      .sheet-cell {
        width: 48px;
        height: 48px;
      }
    </style>
  </head>
  <body>
    <div class="sheet-bar" id="sheet-controls">
      <h1>Slike za Lektorov meni</h1>
    </div>
    <main id="sheet"></main>
    <script src="/lektor-menu-pictures.js"></script>
  </body>
</html>
