<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <title>Prototip AI Lektora</title>
    <link rel="icon" href="/icon.svg" />
    <!--
      The Lektor dialog as it would open over his writing, for trying it as a whole.
      Not part of the app: served by scripts/serve.mjs at /lektor-prototype, and its
      script is built into dist-browser/ only. The box behind the dialog only stands
      in for the editor, and nothing is saved.
    -->
    <link rel="stylesheet" href="/interface.css" />
    <style>
      body {
        flex-direction: column;
        gap: 0.6rem;
        box-sizing: border-box;
        padding: 0.8rem 1.2rem;
        background: var(--page);
        color: var(--ink);
      }

      .prototype-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1rem;
      }

      .prototype-controls button {
        padding: 0.25rem 0.7rem;
      }

      .prototype-controls label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      #text {
        flex: 1;
        box-sizing: border-box;
        width: 100%;
        padding: 0.8rem 1.2rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--page);
        color: var(--ink);
        font-family: var(--writing-font);
        font-size: var(--text-size);
        line-height: var(--writing-leading);
        resize: none;
      }

      #status {
        min-height: 1.4em;
        margin: 0;
        color: var(--quiet);
      }
    </style>
  </head>
  <body>
    <div class="prototype-controls">
      <button type="button" id="open">AI Lektor</button>
      <label>
        Primer
        <select id="sample"></select>
      </label>
      <button type="button" id="reset">Vrati primer na početak</button>
      <label>
        <input type="checkbox" id="dark" />
        Tamno
      </label>
    </div>
    <textarea id="text" spellcheck="false"></textarea>
    <p id="status"></p>
    <dialog id="lektor"></dialog>
    <script src="/lektor-prototype.js"></script>
  </body>
</html>
