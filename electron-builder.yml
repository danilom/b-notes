appId: com.b-notes.app
productName: b-notes

directories:
  output: release

# esbuild has already bundled everything but electron-updater, which stays
# external because it resolves parts of itself at runtime.
files:
  - dist/**/*
  - package.json

win:
  target: nsis
  # Built from assets/icon.svg by scripts/make-icon.mjs, and committed: a
  # release must not depend on a browser being installed to draw it.
  icon: build/icon.ico

# Electron ships 55 locale files at ~49MB. These are Chromium's own strings —
# context menus, form validation — not our UI text. Keeping only what could be
# read here saves about 47MB on a slow disk.
#
# Chromium's `sr` is Cyrillic and it has no Latin variant, so `hr` stands in for
# Serbian written in Latin script. Bosnian and Montenegrin aren't shipped at all.
electronLanguages:
  - en-US
  - sr
  - hr

nsis:
  # No wizard and no questions: the install is done in person, and every choice
  # offered is a choice that can be got wrong later.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # He launches from the desktop shortcut, so it needs a name he'd recognise.
  shortcutName: b-notes
  # Default is "b-notes Setup 0.1.1.exe"; spaces end up percent-encoded in
  # the update URLs and awkward to type on a command line.
  artifactName: ${name}-setup-${version}.${ext}

publish:
  provider: github
  owner: danilom
  repo: b-notes
  # Only electron-builder's `--publish` reads this, and nothing here uses it:
  # releases go out through `npm run release`. Should anything ever publish that
  # way, a pre-release cannot reach him. It is also copied into each build's
  # app-update.yml, where electron-updater ignores it.
  releaseType: prerelease
