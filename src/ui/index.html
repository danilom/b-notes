<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>b-notes</title>
    <style>
      /*
        These five are the only values set directly, and `applyAppearance` in
        appearance.ts overwrites them on this element from what he has chosen.
        Everything below them is derived, so a colour or a size is changed in
        one place and the whole interface follows.
      */
      :root {
        /* Native parts we don't draw ourselves — the search box's own clear
           button, focus rings, any default scrollbar we miss — follow this. */
        color-scheme: light;

        --accent-h: 212;
        --accent-s: 58%;
        --ui-font: Tahoma, 'Segoe UI', sans-serif;
        --ui-size: 16.5px;
        --text-size: 21.6px;

        /* Serif for his writing, and not his to change: it is the one thing on
           screen that should look the same to him everywhere. */
        --writing-font: Georgia, 'Times New Roman', serif;

        /*
          Monochrome in the literal sense: one hue, and everything on screen is
          a shade of it. Not greys with a rumour of colour in them — at the
          lightness a surface needs, a saturation low enough to be "tasteful"
          is simply invisible, and the eye then reads the near-neutral as warm
          whatever hue it was nominally given.

          Three saturations do all the work. Every colour below is one of them
          at some lightness, which is what keeps six themes from needing six
          hand-picked palettes.
        */
        --strong: var(--accent-s);
        --surface: calc(var(--accent-s) * 0.22);
        --muted: calc(var(--accent-s) * 0.1);

        /*
          Lightness is the only thing light and dark disagree about, so it is
          the only thing the mode below swaps. Every colour is still one hue at
          one of three saturations — which is why dark mode needed no second
          palette, just this ladder turned over.

          38% for --faint, not the 53% that looked right: measured against the
          pane, 53% gave the date column 2.8:1 and 44% still left the paler
          themes under 4.5:1. Where the eye and the measurement disagree the
          measurement wins — his eyes are not mine.
        */
        --l-ink: 15%;
        --l-quiet: 38%;
        --l-faint: 42%;
        --l-line: 86%;
        --l-toolbar: 93%;
        --l-hover: 93.5%;
        --l-panel: 96.5%;
        --l-page: 100%;
        --l-chosen: 38%;
        --l-chosen-soft: 91%;
        --l-thumb: 82%;
        --l-thumb-hover: 68%;
        --l-shadow: 12%;
        --shadow-alpha: 0.3;
        --swatch-edge: rgb(0 0 0 / 0.15);

        --ink: hsl(var(--accent-h) var(--muted) var(--l-ink));
        --quiet: hsl(var(--accent-h) var(--muted) var(--l-quiet));
        --faint: hsl(var(--accent-h) var(--muted) var(--l-faint));
        --line: hsl(var(--accent-h) var(--surface) var(--l-line));
        --toolbar: hsl(var(--accent-h) var(--surface) var(--l-toolbar));
        --hover: hsl(var(--accent-h) var(--surface) var(--l-hover));
        --panel: hsl(var(--accent-h) var(--surface) var(--l-panel));

        /* The one surface that stays out of it. He reads essays off this for
           hours, and a tinted page is tiring in a way a tinted frame is not. */
        --page: hsl(var(--accent-h) var(--muted) var(--l-page));

        /* Full strength, and only where something must be pointed at. */
        --chosen: hsl(var(--accent-h) var(--strong) var(--l-chosen));
        --chosen-soft: hsl(var(--accent-h) var(--strong) var(--l-chosen-soft));
      }

      /*
        Not for him — he would not know why the app had turned black, and
        "it looks different today" is the same alarm as "it disappeared". It is
        for whoever is working on the app, which is why the choice is kept on
        the machine rather than synced across his.

        Saturation comes down as well as lightness turning over: the same
        percentage that reads as a tint at 93% reads as mud at 15%.
      */
      :root[data-mode='dark'] {
        color-scheme: dark;

        --surface: calc(var(--accent-s) * 0.35);
        --muted: calc(var(--accent-s) * 0.22);

        --l-ink: 88%;
        --l-quiet: 64%;
        --l-faint: 60%;
        --l-line: 27%;
        --l-toolbar: 20%;
        --l-hover: 23%;
        --l-panel: 18%;
        --l-page: 14%;
        --l-chosen: 70%;
        --l-chosen-soft: 31%;
        --l-thumb: 34%;
        --l-thumb-hover: 48%;
        --l-shadow: 2%;
        --shadow-alpha: 0.6;
        --swatch-edge: rgb(255 255 255 / 0.25);
      }

      /* Carries the same tenth into every padding, gap and width below. */
      html {
        font-size: 110%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        font-family: var(--ui-font);
        font-size: var(--ui-size);
        color: var(--ink);
        background: var(--page);
      }

      /* ---- left: finding things ---- */

      #side {
        width: 22rem;
        min-width: 16rem;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      /*
        Two regions, not one. The toolbar is the app's own strip; the search box
        belongs with the list, because searching is how the list changes. Having
        them share a box read as though search and the button were a pair, which
        they are not.
      */
      #toolbar {
        display: flex;
        align-items: center;
        padding: 0.55rem 0.9rem;
        background: var(--toolbar);
        border-bottom: 1px solid var(--line);
      }

      #finder {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-top: 0.8rem;
      }

      /*
        Chromium's own scrollbars ignore all of the above and stay grey, which
        in dark mode reads as a strip of somebody else's window down the side of
        ours. Safe to style with the -webkit- pseudo-elements because Chromium
        is the only engine this will ever run in.

        Wide rather than fashionable: the whole 14px is the target even though
        only 8px of it is painted, and he is aiming with an unsteady hand on a
        trackpad. Thin scrollbars are a young person's affordance.
      */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }

      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        /* Painted inside a transparent border so the thumb floats clear of the
           edge instead of being welded to it. */
        border: 3px solid transparent;
        border-radius: 7px;
        background: hsl(var(--accent-h) var(--surface) var(--l-thumb));
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: hsl(var(--accent-h) var(--surface) var(--l-thumb-hover));
        background-clip: padding-box;
      }

      button {
        font: inherit;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--page);
        color: var(--ink);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--quiet);
      }

      /*
        Top left, where Windows has put "new" for thirty years — he has seen
        plenty of Windows apps, and the convention is worth more than any
        arrangement we might invent. Sized to its own words rather than stretched
        across the pane: starting a text is a common action, but he returns to
        existing writing far more often, and the loudest thing on screen
        shouldn't be the rarer one.
      */
      #new-note {
        padding: 0.45rem 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }

      /*
        Down in the status bar rather than up in the toolbar: it belongs with
        the things the app says about itself, not with the one action he takes
        all day. Quiet until he reaches for it.
      */
      #appearance-button {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-left: auto;
        padding: 0.3rem 0.6rem;
        border-color: transparent;
        background: none;
        color: var(--quiet);
        font-size: 0.92em;
      }

      #appearance-button:hover {
        border-color: var(--line);
        background: var(--page);
        color: var(--ink);
      }

      /*
        Sized in em so they grow with the text, including when he zooms, and
        greyed so an icon stays a mark beside the words rather than competing
        with them.
      */
      button svg {
        width: 1.15em;
        height: 1.15em;
        flex: none;
        color: var(--faint);
      }

      button:hover svg {
        color: var(--quiet);
      }

      #search-row {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        padding: 0 0.9rem 0.5rem;
      }

      /* Left to itself this is Chromium's own grey, which belongs to no theme
         and sits badly beside the section headings a few pixels below it. */
      ::placeholder {
        color: var(--faint);
        opacity: 1;
      }

      #search {
        font: inherit;
        flex: 1;
        min-width: 0;
        padding: 0.55rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--page);
        color: var(--ink);
      }

      #list {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 2rem;
      }

      .section {
        padding: 1rem 0.9rem 0.3rem;
        font-size: 0.75em;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--quiet);
      }

      .note {
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        border-left: 4px solid transparent;
        display: flex;
        justify-content: space-between;
        gap: 0.6rem;
        align-items: baseline;
      }

      .note:hover {
        background: var(--hover);
      }

      .note[aria-current='true'] {
        background: var(--chosen-soft);
        border-left-color: var(--chosen);
      }

      .note-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note-when {
        font-size: 0.8em;
        color: var(--faint);
        white-space: nowrap;
      }

      /* Never removed from the list, only pushed down and dimmed. */
      .note.aside {
        opacity: 0.45;
      }

      .empty {
        padding: 1rem 0.9rem;
        color: var(--quiet);
        font-style: italic;
      }

      /* ---- right: writing ---- */

      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      #status {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.45rem 0.9rem 0.45rem 1.4rem;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--quiet);
        min-height: 2.6rem;
      }

      /* ---- letters and colours ---- */

      #appearance {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: hsl(var(--accent-h) var(--surface) var(--l-shadow) / 0.42);
      }

      #appearance[hidden] {
        display: none;
      }

      /*
        The panel is the instrument, not the thing being measured. It keeps one
        face at one size whatever he picks, for two reasons: a sample judged
        through a lens that changes with it tells him nothing, and at Najveća a
        panel that grew too would stop fitting on the old laptop's screen. The
        app behind it is the preview. Colour still reaches it, because colour is
        not the thing it is measuring.
      */
      .panel {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        width: min(32rem, 100%);
        max-height: 100%;
        overflow-y: auto;
        padding: 1.1rem 1.4rem 1.6rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--page);
        box-shadow: 0 12px 44px hsl(var(--accent-h) var(--surface) var(--l-shadow) / var(--shadow-alpha));
      }

      .panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .close {
        display: inline-flex;
        padding: 0.4rem;
        border-color: transparent;
        background: none;
      }

      .close:hover {
        border-color: var(--line);
        background: var(--panel);
      }

      .panel footer {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1.6rem;
      }

      /* Pushed to the far end, so it is never what he hits going for U redu. */
      .reset {
        margin-right: auto;
        border-color: transparent;
        background: none;
        color: var(--quiet);
      }

      .reset:hover:not(:disabled) {
        border-color: var(--line);
        background: var(--panel);
        color: var(--ink);
      }

      .reset:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .panel footer button {
        min-width: 6.5rem;
        padding: 0.5rem 1rem;
      }

      .panel footer .reset {
        min-width: 0;
      }

      /* The one the eye should land on, and the one Enter already triggers. */
      .keep {
        border-color: var(--chosen);
        box-shadow: inset 0 0 0 1px var(--chosen);
      }

      .panel h1 {
        margin: 0;
        font-size: 1.12em;
      }

      .panel h2 {
        margin: 1.2rem 0 0.5rem;
        font-size: 0.78em;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--quiet);
      }

      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      /* Deliberately large targets: his hands are not steady on a trackpad. */
      .choice {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 2.7rem;
        padding: 0.5rem 0.85rem;
      }

      .zoom-row {
        align-items: center;
      }

      /* Big square targets. These are the two buttons in the panel he is most
         likely to press more than once, and the only ones he presses to feel
         his way rather than to pick something. */
      .zoom-step {
        min-width: 2.9rem;
        font-size: 1.25em;
        line-height: 1;
      }

      .zoom-step:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .zoom-step:disabled:hover {
        border-color: var(--line);
      }

      /* The only part of how the app looks that can be read out over a phone. */
      .zoom-reading {
        min-width: 4rem;
        text-align: center;
        font-variant-numeric: tabular-nums;
        color: var(--quiet);
      }

      /* No name beside it. He has known what these colours are called for
         eighty years, and six words would only crowd six obvious dots. */
      .colour-choice {
        padding: 0.5rem;
        min-width: 2.7rem;
      }

      .colour-choice .swatch {
        width: 1.4em;
        height: 1.4em;
      }

      .choice[aria-pressed='true'] {
        border-color: var(--chosen);
        background: var(--chosen-soft);
        box-shadow: inset 0 0 0 1px var(--chosen);
      }

      .swatch {
        width: 1.05em;
        height: 1.05em;
        flex: none;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--swatch-edge);
      }

      .done {
        padding: 0.45rem 1rem;
      }

      #editor {
        font-family: var(--writing-font);
        font-size: var(--text-size);
        flex: 1;
        width: 100%;
        padding: 1.6rem 2rem;
        border: 0;
        outline: 0;
        resize: none;
        line-height: 1.65;
        color: var(--ink);
        background: var(--page);
      }
    </style>
  </head>
  <body>
    <div id="side">
      <div id="toolbar">
        <!--
          The icon sits beside the words, never instead of them. He writes
          instructions down for himself, and "click Novi tekst" is a sentence
          that works on the telephone where "the little page symbol" is not.
          Both icons are built in icons.ts, so there is one set and one weight.
        -->
        <button id="new-note" type="button">
          <span id="new-note-label"></span>
        </button>

      </div>
      <div id="finder">
        <div id="search-row">
          <input id="search" type="search" autocomplete="off" />
        </div>
        <div id="list"></div>
      </div>
    </div>

    <div id="main">
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="status">
        <span id="status-text"></span>
        <button id="appearance-button" type="button">
          <span id="appearance-label"></span>
        </button>
      </div>
    </div>

    <div id="appearance" hidden></div>

    <script src="renderer.js"></script>
  </body>
</html>
