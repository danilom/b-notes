<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>b-notes</title>
    <!-- Its own file rather than a data URI, so the CSP above does not have to
         be loosened for it. Only the browser build ever shows this: the
         packaged app's window and taskbar icon come from the exe. -->
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="interface.css" />
  </head>
  <body>
    <div id="side">
      <div id="toolbar">
        <!--
          The icon sits beside the words, never instead of them. He writes
          instructions down for himself, and "click Novi tekst" is a sentence
          that works on the telephone where "the little page symbol" is not.
          Both icons are built in icons.ts, so there is one set and one weight.
        -->
        <button id="new-note" type="button">
          <span id="new-note-label"></span>
        </button>

      </div>
      <div id="finder">
        <div id="search-row">
          <input id="search" type="search" autocomplete="off" />
        </div>
        <div id="list"></div>
      </div>
      <div id="deleted-block">
        <span id="deleted-block-label"></span>
        <button id="deleted-see" type="button"></button>
      </div>
      <!--
        No button inside it, unlike the strip above. The whole strip has always
        been the target and the button only said so; here the trash row
        directly above says it instead, and one word fewer is one thing fewer
        for him to read past on a screen he is trying to write on.

        Which makes the strip itself the control, so it carries the role and
        can be reached and pressed from the keyboard like one.
      -->
      <div id="archive-block" role="button" tabindex="0" hidden>
        <span id="archive-block-label"></span>
      </div>
    </div>

    <div id="main">
      <div id="writing">
        <div id="editor-marks" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false"></textarea>

        <!--
          Where he is among the matches, and how to reach the next one. Sits in
          the empty margin the measure leaves on the right, beside the text it
          is counting rather than in a corner of the window, and appears only
          while a search has found something here.
        -->
        <div id="empty-hint" hidden></div>
        <div id="found" hidden></div>
      </div>
      <div id="status">
        <!-- Above the strip rather than in it: what it reports is not a state,
             and it is over his writing because that is where his eye is. -->
        <div id="toast" hidden></div>
        <span id="status-text"></span>
        <div id="status-actions">
          <!-- Furthest from Obriši tekst, which is the one adjacency worth
               avoiding: this is a button he may press often and that one is a
               safety hatch he should almost never reach. -->
          <button id="copy-all" class="status-action" type="button" disabled>
            <span id="copy-all-label"></span>
          </button>
          <button id="see-versions" class="status-action" type="button" disabled>
            <span id="see-versions-label"></span>
          </button>
          <button id="delete-note" class="status-action" type="button" disabled>
            <span id="delete-note-label"></span>
          </button>
          <button id="appearance-button" class="status-action" type="button">
            <span id="appearance-label"></span>
          </button>
        </div>
      </div>
    </div>

    <dialog id="appearance"></dialog>
    <dialog id="confirm"></dialog>
    <dialog id="deleted"></dialog>
    <dialog id="archive"></dialog>
    <dialog id="versions"></dialog>
    <!-- The one dialog that is not for him; `admin` is what gives it its frame. -->
    <dialog id="advanced" class="admin"></dialog>

    <script src="renderer.js"></script>
  </body>
</html>
