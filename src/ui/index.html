<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>b-notes</title>
    <style>
      /*
        These five are the only values set directly, and `applyAppearance` in
        appearance.ts overwrites them on this element from what he has chosen.
        Everything below them is derived, so a colour or a size is changed in
        one place and the whole interface follows.
      */
      :root {
        /* Native parts we don't draw ourselves — the search box's own clear
           button, focus rings, any default scrollbar we miss — follow this. */
        color-scheme: light;

        --accent-h: 212;
        --accent-s: 58%;
        --ui-font: Tahoma, 'Segoe UI', sans-serif;
        --ui-size: 16.5px;
        --text-size: 21.6px;

        /* Serif for his writing, and not his to change: it is the one thing on
           screen that should look the same to him everywhere. */
        --writing-font: Georgia, 'Times New Roman', serif;

        /*
          How wide a line of his writing may get, in characters. `ch` resolves
          against whichever face and size he has chosen, so this tracks both by
          itself and never binds on a narrow window. 62.5ch is about 90 letters
          in Georgia — wider than a book, which is deliberate: a screen is not a
          page, and at book measure the column reads as a poem.
        */
        --measure: 62.5ch;
        --writing-leading: 1.65;
        --gutter-left: max(2rem, calc((100% - var(--measure)) * 0.4));
        --gutter-right: max(2rem, calc((100% - var(--measure)) * 0.6));
        --scrollbar: 14px;

        /*
          Grey chrome, and the colour spent all in one place.

          Tinting the surfaces was tried twice and is a trap. There is no good
          amount: enough to read as the hue is too loud for something he stares
          at all day, and less than that is worse — a near-neutral beside a
          saturated accent doesn't look neutral, it looks warm, so the green
          theme comes out faintly orange and the eye keeps asking why. The
          middle ground is the whole problem, so there isn't one any more.

          The accent is not weaker for this. It is stronger: with nothing else
          coloured, the text he has open and the choices he has made are the
          only colour on screen, which is exactly what they should be.
        */
        --strong: var(--accent-s);
        --surface: 6%;
        --muted: 4%;

        /*
          Lightness is the only thing light and dark disagree about, so it is
          the only thing the mode below swaps. Every colour is still one hue at
          one of three saturations — which is why dark mode needed no second
          palette, just this ladder turned over.

          --faint is the number that has moved most, and always downwards. 53%
          looked right and gave the date column 2.8:1; 44% still left the paler
          themes short; 42% passed until it was checked through a warm screen,
          which drops everything a further tenth. Where the eye and the
          measurement disagree the measurement wins — his eyes are not mine,
          and nor is his screen.
        */
        --l-ink: 15%;
        --l-quiet: 38%;
        --l-faint: 40%;
        --l-line: 86%;
        --l-toolbar: 93%;
        --l-panel: 96.5%;
        --l-page: 100%;
        --l-chosen: 38%;
        --l-chosen-soft: 91%;
        --l-found: 82%;
        --l-on-chosen: 99%;
        --l-thumb: 82%;
        --l-thumb-hover: 68%;
        --l-shadow: 12%;
        --shadow-alpha: 0.3;
        --swatch-edge: rgb(0 0 0 / 0.15);

        /* Not the accent's hue: the chrome is the same grey whichever colour
           he picks, so nothing can be the wrong shade of it. */
        --grey-h: 220;

        --ink: hsl(var(--grey-h) var(--muted) var(--l-ink));
        --quiet: hsl(var(--grey-h) var(--muted) var(--l-quiet));
        --faint: hsl(var(--grey-h) var(--muted) var(--l-faint));
        --line: hsl(var(--grey-h) var(--surface) var(--l-line));
        --toolbar: hsl(var(--grey-h) var(--surface) var(--l-toolbar));
        /*
          Hover and press are a wash laid over whatever is underneath, not
          colours of their own.

          A fixed lightness only works against one background. The same
          --hover that dropped six points against the dialog's white rose half
          a point against the toolbar, which is to say it vanished exactly
          where a button most needed to answer him. Darkening by a proportion
          reads the same on every surface the app has.
        */
        --wash: rgb(0 0 0 / 0.055);
        --wash-firm: rgb(0 0 0 / 0.12);
        --panel: hsl(var(--grey-h) var(--surface) var(--l-panel));

        /* The one surface that stays out of it. He reads essays off this for
           hours, and a tinted page is tiring in a way a tinted frame is not. */
        --page: hsl(var(--grey-h) var(--muted) var(--l-page));

        /* Full strength, and only where something must be pointed at. */
        --chosen: hsl(var(--accent-h) var(--strong) var(--l-chosen));
        --chosen-soft: hsl(var(--accent-h) var(--strong) var(--l-chosen-soft));
        /* Stronger than a selected row: this has to carry his own text on top. */
        --found: hsl(var(--accent-h) var(--strong) var(--l-found));
        /* Whatever can be read on top of a solid accent, either way up. */
        --on-chosen: hsl(var(--grey-h) var(--muted) var(--l-on-chosen));
      }

      /*
        Not for him — he would not know why the app had turned black, and
        "it looks different today" is the same alarm as "it disappeared". It is
        for whoever is working on the app, which is why the choice is kept on
        the machine rather than synced across his.

        Saturation comes down as well as lightness turning over: the same
        percentage that reads as a tint at 93% reads as mud at 15%.
      */
      :root[data-mode='dark'] {
        color-scheme: dark;

        --surface: 8%;
        --muted: 6%;

        --l-ink: 88%;
        --l-quiet: 68%;
        --l-faint: 68%;
        --l-line: 27%;
        --l-toolbar: 20%;
        --l-panel: 18%;
        --l-page: 14%;
        /* Light over dark, for the same reason. */
        --wash: rgb(255 255 255 / 0.07);
        --wash-firm: rgb(255 255 255 / 0.16);

        --l-chosen: 70%;
        --l-chosen-soft: 31%;
        --l-found: 38%;
        --l-on-chosen: 10%;
        --l-thumb: 34%;
        --l-thumb-hover: 48%;
        --l-shadow: 2%;
        --shadow-alpha: 0.6;
        --swatch-edge: rgb(255 255 255 / 0.25);
      }

      /* Carries the same tenth into every padding, gap and width below. */
      html {
        font-size: 110%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        font-family: var(--ui-font);
        font-size: var(--ui-size);
        color: var(--ink);
        background: var(--page);
      }

      /* ---- left: finding things ---- */

      #side {
        width: 22rem;
        min-width: 16rem;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      /*
        Two regions, not one. The toolbar is the app's own strip; the search box
        belongs with the list, because searching is how the list changes. Having
        them share a box read as though search and the button were a pair, which
        they are not.
      */
      #toolbar {
        display: flex;
        align-items: center;
        padding: 0.55rem 0.9rem;
        background: var(--toolbar);
        border-bottom: 1px solid var(--line);
      }

      #finder {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-top: 0.8rem;
      }

      /*
        Chromium's own scrollbars ignore all of the above and stay grey, which
        in dark mode reads as a strip of somebody else's window down the side of
        ours. Safe to style with the -webkit- pseudo-elements because Chromium
        is the only engine this will ever run in.

        Wide rather than fashionable: the whole 14px is the target even though
        only 8px of it is painted, and he is aiming with an unsteady hand on a
        trackpad. Thin scrollbars are a young person's affordance.
      */
      ::-webkit-scrollbar {
        width: var(--scrollbar);
        height: var(--scrollbar);
      }

      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        /* Painted inside a transparent border so the thumb floats clear of the
           edge instead of being welded to it. */
        border: 3px solid transparent;
        border-radius: 7px;
        background: hsl(var(--grey-h) var(--surface) var(--l-thumb));
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: hsl(var(--grey-h) var(--surface) var(--l-thumb-hover));
        background-clip: padding-box;
      }

      button {
        font: inherit;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--page);
        color: var(--ink);
        cursor: pointer;
      }

      /*
        Three states, because a button that only changes its border when the
        pointer arrives, and does nothing at all when clicked, leaves him
        wondering whether he hit it. He clicks twice when nothing appears to
        happen — that is the behaviour the single-instance lock exists for.

        Pressed both darkens and drops a pixel: colour alone is easy to miss on
        an old washed-out laptop panel, and movement is not.
      */
      button:hover:not(:disabled) {
        background-image: linear-gradient(var(--wash), var(--wash));
        border-color: var(--quiet);
      }

      button:active:not(:disabled) {
        background-image: linear-gradient(var(--wash-firm), var(--wash-firm));
        border-color: var(--quiet);
        transform: translateY(1px);
      }

      /* Only for the keyboard: `:focus-visible` stays quiet for a mouse click,
         so he never sees a ring he did not ask for. */
      button:focus-visible {
        outline: 2px solid var(--chosen);
        outline-offset: 2px;
      }

      button:active:not(:disabled) svg,
      button:hover:not(:disabled) svg {
        color: var(--quiet);
      }

      /*
        Top left, where Windows has put "new" for thirty years — he has seen
        plenty of Windows apps, and the convention is worth more than any
        arrangement we might invent. Sized to its own words rather than stretched
        across the pane: starting a text is a common action, but he returns to
        existing writing far more often, and the loudest thing on screen
        shouldn't be the rarer one.
      */
      #new-note {
        padding: 0.45rem 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }

      /*
        Down in the status bar rather than up in the toolbar: it belongs with
        the things the app says about itself, not with the one action he takes
        all day. Quiet until he reaches for it.
      */
      #appearance-button {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-left: auto;
        padding: 0.3rem 0.6rem;
        border-color: transparent;
        background: none;
        color: var(--quiet);
        font-size: 0.92em;
      }

      #appearance-button:hover:not(:disabled) {
        border-color: var(--line);
        color: var(--ink);
      }

      /*
        Sized in em so they grow with the text, including when he zooms, and
        greyed so an icon stays a mark beside the words rather than competing
        with them.
      */
      button svg {
        width: 1.15em;
        height: 1.15em;
        flex: none;
        color: var(--faint);
      }

      #search-row {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        padding: 0 0.9rem 0.5rem;
      }

      /* Left to itself this is Chromium's own grey, which belongs to no theme
         and sits badly beside the section headings a few pixels below it. */
      ::placeholder {
        color: var(--faint);
        opacity: 1;
      }

      #search {
        font: inherit;
        flex: 1;
        min-width: 0;
        padding: 0.55rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--page);
        color: var(--ink);
      }

      #list {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 2rem;
      }

      /*
        Each heading holds at the top of the list while its own texts scroll
        under it, and is pushed off by the next one.

        Five hundred and eighty rows is a long way down, and by the middle of
        them the heading that said which part of the list this is has been gone
        for a while. He would be looking at a wall of titles with nothing saying
        whether he is among the recent ones, the found ones, or the rest.

        Opaque, because rows pass beneath it — `--panel` is the pane's own
        colour, so it reads as the list holding still rather than as a bar.
      */
      .section {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 1rem 0.9rem 0.3rem;
        background: var(--panel);
        font-size: 0.75em;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--quiet);
      }

      .note {
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        border-left: 4px solid transparent;
        display: flex;
        justify-content: space-between;
        gap: 0.6rem;
        align-items: baseline;
      }

      .note:hover {
        background-image: linear-gradient(var(--wash), var(--wash));
      }

      .note:active {
        background-image: linear-gradient(var(--wash-firm), var(--wash-firm));
      }

      .note[aria-current='true'] {
        background-color: var(--chosen-soft);
        border-left-color: var(--chosen);
      }

      .note-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note-when {
        font-size: 0.8em;
        color: var(--faint);
        white-space: nowrap;
      }

      /* Never removed from the list, only pushed down and dimmed. */
      .note.aside {
        opacity: 0.45;
      }

      /* Italic because it is not a title yet — it is the app describing what he
         is looking at until his own first line takes over. */
      .note.draft .note-title {
        font-style: italic;
      }

      .empty {
        padding: 1rem 0.9rem;
        color: var(--quiet);
        font-style: italic;
      }

      /* ---- right: writing ---- */

      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      #status {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.45rem 0.9rem 0.45rem 1.4rem;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--quiet);
        min-height: 2.6rem;
      }

      /* ---- letters and colours ---- */

      #appearance {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: hsl(var(--grey-h) var(--surface) var(--l-shadow) / 0.42);
      }

      #appearance[hidden] {
        display: none;
      }

      /*
        The panel is the instrument, not the thing being measured. It keeps one
        face at one size whatever he picks, for two reasons: a sample judged
        through a lens that changes with it tells him nothing, and at Najveća a
        panel that grew too would stop fitting on the old laptop's screen. The
        app behind it is the preview. Colour still reaches it, because colour is
        not the thing it is measuring.
      */
      .panel {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        width: min(32rem, 100%);
        max-height: 100%;
        overflow-y: auto;
        /* No vertical padding of its own: the pinned header and footer carry
           it, so nothing scrolls out from under them. */
        padding: 0 1.4rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--page);
        box-shadow: 0 12px 44px hsl(var(--grey-h) var(--surface) var(--l-shadow) / var(--shadow-alpha));
      }

      /*
        Pinned to the top and bottom of the panel, not scrolled with it.

        At 200% on a small window the choices are taller than the panel, and a
        way out that has scrolled off the screen is not a way out. The X and
        Vrati na početno stay where they are whatever is happening between them.
      */
      .panel header,
      .panel footer {
        position: sticky;
        z-index: 1;
        background: var(--page);
      }

      .panel header {
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 0 0.6rem;
        border-bottom: 1px solid var(--line);
      }

      .close {
        display: inline-flex;
        padding: 0.4rem;
        border-color: transparent;
        background: none;
      }

      .close:hover:not(:disabled) {
        border-color: var(--line);
      }

      .panel footer {
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
        padding: 0.7rem 0 0.9rem;
        border-top: 1px solid var(--line);
      }

      /*
        A real button, not a ghost.

        It was drawn faintly to keep it out of the way, and went too far: a
        borderless grey label among two bordered buttons reads as disabled, and
        the one control whose whole job is rescuing him from a mess he can't
        undo must not look like the one control that isn't working. Distance
        keeps it clear of U redu; it doesn't need to be dim as well.
      */
      .reset {
        margin-right: auto;
        white-space: nowrap;
      }

      .panel footer button {
        min-width: 6.5rem;
        padding: 0.5rem 1rem;
      }



      /* The one the eye should land on, and the one Enter already triggers. */
      .keep {
        border-color: var(--chosen);
        box-shadow: inset 0 0 0 1px var(--chosen);
      }

      .panel h1 {
        margin: 0;
        font-size: 1.12em;
      }

      /* The two halves: his writing, and the app around it. */
      .panel h2 {
        margin: 1rem 0 0;
        padding-bottom: 0.3rem;
        border-bottom: 1px solid var(--line);
        font-size: 0.95em;
        font-weight: 600;
        color: var(--ink);
      }

      .panel-half:first-of-type h2 {
        margin-top: 0.8rem;
      }

      .panel h3 {
        margin: 0.7rem 0 0.35rem;
        font-size: 0.78em;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--quiet);
      }

      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .choices:has(.writing-choice) {
        flex-direction: column;
      }

      /*
        One height for everything in here, the same as U redu at the foot. They
        were a third taller, which cost the panel more room than his hands ever
        gained — and this is a dialog he visits once, not a control he hunts for
        daily while writing.
      */
      .choice {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.4rem 0.8rem;
      }

      .zoom-row {
        align-items: center;
        flex-wrap: nowrap;
      }

      /*
        Two groups that stay on one line at every size.

        They used to wrap apart at some zooms and not others, which looks like
        a fault rather than a layout: past a certain zoom the panel stops being
        32rem wide and becomes as wide as the window allows, so its contents
        narrow while the buttons inside do not. Rather than let the groups
        break apart, the swatches wrap within their own group — six across, or
        three and three, but always beside the size rather than beneath it.
      */
      .group-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 0 1.3rem;
        align-items: flex-start;
      }

      .group-row > * {
        min-width: 0;
      }

      /* The size control is nowrap, so it keeps its width and the colours give. */
      .group-row > *:first-child {
        flex: 0 0 auto;
      }

      .group-row > *:last-child {
        flex: 1 1 0;
      }

      /*
        Stacked and full width: a line of prose has to be seen as a line, and
        all three the same height, which means all three on exactly one line.
        The sample is longer than the panel, so it trails off rather than
        wrapping — he is judging the letters, and he can see enough of them.
      */
      .writing-choice {
        width: 100%;
        justify-content: flex-start;
        text-align: left;
        line-height: 1.3;
        overflow: hidden;
      }

      .writing-choice span {
        display: block;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        /*
          Fixed rather than proportional, so the three buttons are the same
          height. Matching x-heights means the three faces are set at three
          different pixel sizes, and a line box that followed each of them
          would leave Verdana's button visibly shorter than the other two.
        */
        line-height: 21px;
      }

      /* Square, and the same square as a colour swatch beside it. */
      .zoom-step {
        min-width: 2.6rem;
        padding: 0.4rem;
        font-size: 1.1em;
        /* Matching the line box of every other choice, so a larger glyph
           doesn't make the button shorter than the swatch beside it. */
        line-height: 1.2;
      }

      .zoom-step:disabled {
        opacity: 0.4;
      }

      button:disabled {
        cursor: default;
      }

      /* The only part of how the app looks that can be read out over a phone.
         Tabular figures so it doesn't jog sideways between 90% and 100%. */
      .zoom-reading {
        min-width: 2.9rem;
        text-align: center;
        font-variant-numeric: tabular-nums;
        color: var(--quiet);
      }

      /* No name beside it. He has known what these colours are called for
         eighty years, and six words would only crowd six obvious dots. */
      .colour-choice {
        padding: 0.4rem;
        min-width: 2.6rem;
      }

      .colour-choice .swatch {
        width: 1.4em;
        height: 1.4em;
      }

      /*
        What he has chosen is filled, not tinted.

        A pale wash of the accent sat two points of lightness from the hover
        colour — near enough to read as the same thing, different enough to
        read as a mistake, and pale fills look disabled rather than chosen
        anyway. Solid is what Windows has meant by "selected" for thirty years
        and cannot be mistaken for "your pointer is here".
      */
      .choice[aria-pressed='true'] {
        border-color: var(--chosen);
        background-color: var(--chosen);
        color: var(--on-chosen);
        box-shadow: none;
      }

      /* Except here: the swatch is the sample, and filling the button behind it
         would paint over the very thing he is choosing. A ring instead. */
      .colour-choice[aria-pressed='true'] {
        background-color: var(--page);
        border-color: var(--chosen);
        box-shadow: inset 0 0 0 2px var(--chosen);
      }

      .swatch {
        width: 1.05em;
        height: 1.05em;
        flex: none;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px var(--swatch-edge);
      }

      .done {
        padding: 0.45rem 1rem;
      }

      /*
        The measure: how wide a line of his writing is allowed to get.

        Past about ninety characters the eye starts missing the next line on
        the way back, and on his screen the editor was running to a hundred and
        twenty. In `ch` rather than pixels because it is then relative to the
        face and the size he has chosen — 50ch lands every font we offer
        between 64 and 72 characters, and on a narrow window it simply never
        binds. That is why this is a fixed rule and not another thing for him
        to set: there is one right answer and it follows him about by itself.
      */
      #editor {
        font-family: var(--writing-font);
        font-size: var(--text-size);
        flex: 1;
        width: 100%;
        padding-top: 1.6rem;
        padding-bottom: 1.6rem;
        /*
          The margins make the measure, rather than the element being narrowed
          and centred. Narrowing it took the scrollbar along with it, leaving
          the bar floating beside his text instead of sitting at the edge of
          the window where every other scrollbar he has ever used lives.

          Split 40/60 rather than evenly: the window is read as a whole, and
          with all that weight in the left pane a column centred in what's left
          sits right of where the eye expects the middle. Leaning it back
          toward the list also shortens the trip from choosing a text to
          reading it.
        */
        padding-left: var(--gutter-left);
        padding-right: var(--gutter-right);
        border: 0;
        outline: 0;
        resize: none;
        line-height: var(--writing-leading);
        color: var(--ink);
        /* See below: the marks show through from behind. */
        background: none;
        /*
          Always a scrollbar, never sometimes. It stops the text reflowing the
          first time an essay grows past one screen — and, more to the point,
          the layer behind gets one too, so both give up exactly the same
          fraction of a pixel to it and wrap on the same words.
        */
        overflow-y: scroll;
      }

      /*
        The matches, painted behind his writing.

        Text inside a textarea cannot be styled — there are no elements in there
        to colour. So the same text is laid out again underneath in a plain div,
        with the matches wrapped in `mark` and everything else made invisible,
        and the textarea floats on top with no background of its own. He sees
        his own text, over our highlighting, and the textarea he is typing in is
        untouched: native editing, native undo, still plain text.

        This layer is also how the scrolling works. A textarea cannot say where
        a character sits on screen; the div can, so the first match's position
        here is what the textarea is scrolled to.

        Everything that decides where a line breaks is shared with the textarea
        above — font, size, leading, gutters, width — because if the two wrap
        differently the marks land on the wrong words.
      */
      #writing {
        position: relative;
        flex: 1;
        min-height: 0;
        background: var(--page);
      }

      #editor,
      #editor-marks {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        font-family: var(--writing-font);
        font-size: var(--text-size);
        line-height: var(--writing-leading);
        padding-top: 1.6rem;
        padding-bottom: 1.6rem;
      }

      #editor-marks {
        /*
          The same gutters as the textarea, and a scrollbar of its own.

          Declaring the gutters plus a nominal scrollbar width was close but not
          exact — of eighteen combinations of font, size and zoom, thirteen
          wrapped a line differently, which walks the marks off the words
          further down a long essay. Copying the textarea's measured width was
          worse: the width it reports is a whole number and the width it has is
          not, and a third of a pixel is enough to move a word. Giving this
          layer a real scrollbar too, and then hiding it, makes the two boxes
          identical by construction rather than by arithmetic.
        */
        padding-left: var(--gutter-left);
        padding-right: var(--gutter-right);
        overflow-y: scroll;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        color: transparent;
        user-select: none;
      }

      /* Present, so it takes up its width; invisible, because it is not his. */
      #editor-marks::-webkit-scrollbar-thumb,
      #editor-marks::-webkit-scrollbar-track {
        background: transparent;
      }

      #editor-marks mark {
        color: transparent;
        background: var(--found);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="side">
      <div id="toolbar">
        <!--
          The icon sits beside the words, never instead of them. He writes
          instructions down for himself, and "click Novi tekst" is a sentence
          that works on the telephone where "the little page symbol" is not.
          Both icons are built in icons.ts, so there is one set and one weight.
        -->
        <button id="new-note" type="button">
          <span id="new-note-label"></span>
        </button>

      </div>
      <div id="finder">
        <div id="search-row">
          <input id="search" type="search" autocomplete="off" />
        </div>
        <div id="list"></div>
      </div>
    </div>

    <div id="main">
      <div id="writing">
        <div id="editor-marks" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
      <div id="status">
        <span id="status-text"></span>
        <button id="appearance-button" type="button">
          <span id="appearance-label"></span>
        </button>
      </div>
    </div>

    <div id="appearance" hidden></div>

    <script src="renderer.js"></script>
  </body>
</html>
