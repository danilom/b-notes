<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>b-notes</title>
    <!-- Its own file rather than a data URI, so the CSP above does not have to
         be loosened for it. Only the browser build ever shows this: the
         packaged app's window and taskbar icon come from the exe. -->
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="interface.css" />
    <link rel="stylesheet" href="lektor.css" />
  </head>
  <body>
    <div id="side">
      <div id="toolbar">
        <!--
          The icon sits beside the words, never instead of them. He writes
          instructions down for himself, and "click Novi tekst" is a sentence
          that works on the telephone where "the little page symbol" is not.
          Both icons are built in icons.ts, so there is one set and one weight.
        -->
        <button id="new-note" type="button">
          <span id="new-note-label"></span>
        </button>
        <!-- The list folds away to the left, from the edge it folds towards,
             well apart from Novi tekst. Only the chevron: he presses this on
             purpose. The way back is the one that needs words. -->
        <button id="hide-list" type="button"></button>
      </div>
      <div id="finder">
        <div id="search-row">
          <input id="search" type="search" autocomplete="off" />
        </div>
        <div id="list"></div>
      </div>
      <div id="deleted-block">
        <span id="deleted-block-label"></span>
        <button id="deleted-see" type="button"></button>
      </div>
      <!--
        No button inside it, unlike the strip above. The whole strip has always
        been the target and the button only said so; here the trash row
        directly above says it instead, and one word fewer is one thing fewer
        for him to read past on a screen he is trying to write on.

        Which makes the strip itself the control, so it carries the role and
        can be reached and pressed from the keyboard like one.
      -->
      <div id="archive-block" role="button" tabindex="0" hidden>
        <span id="archive-block-label"></span>
      </div>
    </div>

    <!-- The way back to the list while it is folded away: the list's header,
         folded up at the window's edge, with the chevron where the other one
         was. Only the chevron: having pressed one to fold the list, he will
         press this one to bring it back. Not kept between runs, so closing
         and opening the app always brings the list back too. -->
    <button id="show-list" type="button" hidden></button>

    <div id="main">
      <div id="writing">
        <div id="editor-marks" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false"></textarea>

        <!--
          Where he is among the matches, and how to reach the next one. Sits in
          the empty margin the measure leaves on the right, beside the text it
          is counting rather than in a corner of the window, and appears only
          while a search has found something here.
        -->
        <div id="empty-hint" hidden></div>
        <div id="found" hidden></div>
      </div>
      <div id="status">
        <!-- Above the strip rather than in it: what it reports is not a state,
             and it is over his writing because that is where his eye is. -->
        <div id="toast" hidden></div>
        <!-- Two rows: what he does to the text in front of him on top, and
             under it the line that reports, beside the two quiet buttons that
             are not about this text's words. -->
        <div id="status-actions">
          <!-- Furthest from Obriši tekst, which is the one adjacency worth
               avoiding: this is a button he may press often and that one is a
               safety hatch he should almost never reach. -->
          <button id="copy-all" class="status-action" type="button" disabled>
            <span id="copy-all-label"></span>
          </button>
          <button id="see-versions" class="status-action" type="button" disabled>
            <span id="see-versions-label"></span>
          </button>
          <button id="delete-note" class="status-action" type="button" disabled>
            <span id="delete-note-label"></span>
          </button>
          <!-- Last of the buttons about this text; Premesti u Resoph and Izgled stay at the far right. -->
          <button id="lektor-open" class="status-action" type="button" disabled>
            <span id="lektor-open-label"></span>
          </button>
        </div>
        <!-- What the app says about his text, then, quieter, about a new version on its way. -->
        <span id="status-text"><span id="status-said"></span><span id="status-update" hidden></span></span>
        <div id="status-quiet">
          <button id="appearance-button" class="status-action status-quiet" type="button">
            <span id="appearance-label"></span>
          </button>
          <!-- A text of b-notes', back into Resoph. Rare, so quiet; but always
               here on a machine with a Resoph folder, greyed where it cannot
               be done, so it has one place he can learn. In the corner, with
               Izgled between it and the Lektor, so a hand missing the Lektor
               lands on a button that changes nothing. -->
          <button id="move-to-resoph" class="status-action status-quiet" type="button" hidden>
            <span id="move-to-resoph-label"></span>
          </button>
        </div>
      </div>
      <!-- Beside his text and above the strip: it belongs to the text, not to the app. -->
      <aside id="lektor-side"></aside>
    </div>

    <dialog id="appearance"></dialog>
    <dialog id="confirm"></dialog>
    <dialog id="close-editors"></dialog>
    <dialog id="deleted"></dialog>
    <dialog id="archive"></dialog>
    <dialog id="versions"></dialog>
    <dialog id="lektor-dialog"></dialog>
    <!-- Not for him: whoever set the machine up. -->
    <dialog id="advanced"></dialog>

    <script src="renderer.js"></script>
  </body>
</html>
