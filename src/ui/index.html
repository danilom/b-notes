<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>b-notes</title>
    <style>
      :root {
        --ink: #1a1a1a;
        --quiet: #5c5c5c;
        --faint: #9a9a9a;
        --line: #d4d4d4;
        --page: #ffffff;
        --panel: #f4f3f1;
        --chosen: #1d5fa8;
        --chosen-soft: #dbe8f7;
        --toolbar: #e8e6e2;

        /* Sans for everything that is the app talking; serif for his writing. */
        --ui-font: system-ui, 'Segoe UI', sans-serif;
        --writing-font: Georgia, 'Times New Roman', serif;

        /* He is elderly. The app is a tenth larger than it would otherwise be,
           and his own writing a fifth. */
        --ui-size: 16.5px;
        --text-size: 21.6px;
      }

      /* Carries the same tenth into every padding, gap and width below. */
      html {
        font-size: 110%;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        font-family: var(--ui-font);
        font-size: var(--ui-size);
        color: var(--ink);
        background: var(--page);
      }

      /* ---- left: finding things ---- */

      #side {
        width: 22rem;
        min-width: 16rem;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      /*
        Two regions, not one. The toolbar is the app's own strip; the search box
        belongs with the list, because searching is how the list changes. Having
        them share a box read as though search and the button were a pair, which
        they are not.
      */
      #toolbar {
        padding: 0.55rem 0.9rem;
        background: var(--toolbar);
        border-bottom: 1px solid var(--line);
      }

      #finder {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-top: 0.8rem;
      }

      button {
        font: inherit;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--quiet);
      }

      /*
        Top left, where Windows has put "new" for thirty years — he has seen
        plenty of Windows apps, and the convention is worth more than any
        arrangement we might invent. Sized to its own words rather than stretched
        across the pane: starting a text is a common action, but he returns to
        existing writing far more often, and the loudest thing on screen
        shouldn't be the rarer one.
      */
      #new-note {
        align-self: flex-start;
        padding: 0.45rem 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }

      /*
        Sized in em so it grows with the text, including when he zooms, and
        greyed so it stays a mark beside the words rather than competing with
        them. The words are what he reads; the icon is only what he aims at.
      */
      #new-note svg {
        width: 1.05em;
        height: 1.05em;
        flex: none;
        color: var(--faint);
      }

      #new-note:hover svg {
        color: var(--quiet);
      }

      #search-row {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        padding: 0 0.9rem 0.5rem;
      }

      #search {
        font: inherit;
        flex: 1;
        min-width: 0;
        padding: 0.55rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
        color: var(--ink);
      }

      #list {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 2rem;
      }

      .section {
        padding: 1rem 0.9rem 0.3rem;
        font-size: 0.75em;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--quiet);
      }

      .note {
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        border-left: 4px solid transparent;
        display: flex;
        justify-content: space-between;
        gap: 0.6rem;
        align-items: baseline;
      }

      .note:hover {
        background: #eceae7;
      }

      .note[aria-current='true'] {
        background: var(--chosen-soft);
        border-left-color: var(--chosen);
      }

      .note-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note-when {
        font-size: 0.8em;
        color: var(--faint);
        white-space: nowrap;
      }

      /* Never removed from the list, only pushed down and dimmed. */
      .note.aside {
        opacity: 0.45;
      }

      .empty {
        padding: 1rem 0.9rem;
        color: var(--quiet);
        font-style: italic;
      }

      /* ---- right: writing ---- */

      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      #status {
        padding: 0.6rem 1.4rem;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--quiet);
        min-height: 2.4rem;
        display: flex;
        align-items: center;
      }

      #editor {
        font-family: var(--writing-font);
        font-size: var(--text-size);
        flex: 1;
        width: 100%;
        padding: 1.6rem 2rem;
        border: 0;
        outline: 0;
        resize: none;
        line-height: 1.65;
        color: var(--ink);
        background: var(--page);
      }
    </style>
  </head>
  <body>
    <div id="side">
      <div id="toolbar">
        <!--
          The icon sits beside the words, never instead of them. He writes
          instructions down for himself, and "click Novi tekst" is a sentence
          that works on the telephone where "the little page symbol" is not.
        -->
        <button id="new-note" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M3.5 1.5h5l4 4v9h-9z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linejoin="round"
            />
            <path
              d="M8.5 1.5v4h4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linejoin="round"
            />
          </svg>
          <span id="new-note-label"></span>
        </button>
      </div>
      <div id="finder">
        <div id="search-row">
          <input id="search" type="search" autocomplete="off" />
        </div>
        <div id="list"></div>
      </div>
    </div>

    <div id="main">
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="status"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
